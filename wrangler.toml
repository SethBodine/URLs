name = "link-shortener"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# ─────────────────────────────────────────────────────────────────────────────
# CRON TRIGGERS — NOT configured here for Pages projects
# ─────────────────────────────────────────────────────────────────────────────
# [triggers] / crons = [...] is a Cloudflare Workers-only key and causes a
# build failure in Pages projects.
#
# To enable the scheduled Safe Browsing rescan, set up the cron trigger
# manually in the Cloudflare dashboard after deploying:
#
#   Workers & Pages → your project → Settings → Functions → Cron Triggers
#   → Add:  0 3 * * *   (daily at 03:00 UTC — adjust to taste)
#
# The onScheduled handler in functions/api/scan.js will be called automatically.
#
# To trigger a rescan manually at any time (no cron needed):
#   • Use the ⟳ Rescan button in the admin panel
#   • Or via curl:
#       curl -X POST https://your-domain/api/scan \
#            -H "Authorization: Bearer YOUR_ADMIN_KEY" \
#            -H "Content-Type: application/json" \
#            -d '{}'
#
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# KV NAMESPACE BINDING
# ─────────────────────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "LINKS"
id = "ac7a277e3c554a4cb072071e976b28c6"
preview_id = "ac7a277e3c554a4cb072071e976b28c6"

# ─────────────────────────────────────────────────────────────────────────────
# RATE LIMITING
# ─────────────────────────────────────────────────────────────────────────────
[vars]
RATE_LIMIT_HOURLY = "25"   # max requests per IP per hour  (shorten / lookup / mylinks)
RATE_LIMIT_DAILY  = "100"  # max requests per IP per day   (shorten / lookup / mylinks)
# Admin endpoints are never rate-limited.
# Override per-environment in [env.production.vars] if needed.

# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED SECRETS (set in Cloudflare Pages dashboard, not here)
# ─────────────────────────────────────────────────────────────────────────────
#
# Settings → Environment variables → Add for both Production and Preview:
#
#   ADMIN_KEY             Bearer token for /api/admin, /api/scan, /api/blocklist
#                         Minimum 16 characters. Encrypt: Yes.
#
#   OWNER_HASH_SECRET     HMAC-SHA256 secret for browser fingerprint verification
#                         Minimum 32 characters. Encrypt: Yes.
#
#   SAFE_BROWSING_API_KEY Google Safe Browsing API v4 key
#                         Required for threat checks and scheduled rescan.
#                         Encrypt: Yes.
#                         Get one: console.cloud.google.com → Safe Browsing API
#
# ─────────────────────────────────────────────────────────────────────────────
